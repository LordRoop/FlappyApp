<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy">
<meta name="theme-color" content="#3ab8f0">
<link id="apple-touch-icon" rel="apple-touch-icon" href="">
<title>Flappy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky: #5ec8f0;
    --ground: #c8a95e;
    --pipe: #4caf50;
    --pipe-dark: #388e3c;
    --bird: #f7c948;
    --text: #fff;
    --shadow: #2a1a00;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    touch-action: none;
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }

  #score {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(20px, 5vw, 32px);
    color: #fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    margin-top: 24px;
    letter-spacing: 2px;
    display: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
  }

  .card {
    background: rgba(0,0,0,0.72);
    border: 3px solid #f7c948;
    border-radius: 16px;
    padding: 28px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 320px;
    width: 85%;
    box-shadow: 0 8px 0 #a07c00, 0 0 40px rgba(0,0,0,0.6);
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(22px, 6vw, 36px);
    color: #f7c948;
    text-shadow: 3px 3px 0 #a07c00;
    letter-spacing: 1px;
    text-align: center;
  }

  .subtitle {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.5vw, 12px);
    color: #fff;
    text-align: center;
    line-height: 1.8;
    opacity: 0.85;
  }

  .tap-hint {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2.8vw, 13px);
    color: #f7c948;
    animation: blink 1s step-end infinite;
    text-align: center;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .score-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    border-top: 2px solid rgba(255,255,255,0.2);
    padding-top: 14px;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.2vw, 11px);
    color: #fff;
  }

  .score-row span:last-child {
    color: #f7c948;
  }

  .medal {
    font-size: 32px;
    margin-bottom: 4px;
  }

  #gameOver { display: none; }
  #startScreen { display: flex; }

  .diff-btns {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .diff-btn {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(7px, 2vw, 10px);
    padding: 10px 4px;
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: #ccc;
    transition: all 0.15s;
    line-height: 1.6;
    pointer-events: auto;
  }
  .diff-btn:active { transform: scale(0.95); }
  .diff-btn.selected-easy {
    background: rgba(76,175,80,0.22);
    border-color: #4caf50;
    color: #a5d6a7;
  }
  .diff-btn.selected-hard {
    background: rgba(244,67,54,0.22);
    border-color: #f44336;
    color: #ef9a9a;
  }
  .start-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 3vw, 14px);
    padding: 12px 28px;
    border-radius: 12px;
    border: 3px solid #f7c948;
    background: #f7c948;
    color: #1a1a00;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #a07c00;
    transition: transform 0.1s, box-shadow 0.1s;
    width: 100%;
    pointer-events: auto;
  }
  .start-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #a07c00;
  }

  .diff-label {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(7px, 2vw, 9px);
    color: #aaa;
    text-align: center;
  }

  #installBanner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.96);
    border-top: 2.5px solid #f7c948;
    padding: 16px 18px 32px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    z-index: 100;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    font-size: 9px;
    line-height: 1.8;
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(.22,1,.36,1);
  }
  #installBanner.show { transform: translateY(0); }
  #installBanner .bird-icon { font-size: 28px; flex-shrink: 0; margin-top: 2px; }
  #installBanner .install-text { flex: 1; }
  #installBanner .install-title { color: #f7c948; display: block; margin-bottom: 8px; font-size: 10px; }
  #installBanner .steps { color: #bbb; font-size: 8px; line-height: 2.2; }
  #installBanner .steps b { color: #f7c948; }
  #closeBanner {
    background: none; border: 1.5px solid #444; color: #888;
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    padding: 6px 8px; cursor: pointer; border-radius: 6px; flex-shrink: 0;
    margin-top: 2px;
    pointer-events: auto;
  }

  /* Allow interaction for overlay cards and their controls (overlay itself is non-interactive) */
  #overlay .card { pointer-events: auto; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="score">0</div>
  </div>

  <div id="overlay">
    <div id="startScreen" class="card">
      <div class="title">FLAPPY</div>
      <div class="subtitle">Dodge the pipes.<br>Don't hit the ground.</div>
      <div class="diff-label">DIFFICULTY</div>
      <div class="diff-btns">
        <button class="diff-btn" id="btnEasy" onclick="setDiff('easy')">🟢<br>EASY</button>
        <button class="diff-btn selected-hard" id="btnHard" onclick="setDiff('hard')">🔴<br>HARD</button>
      </div>
      <button class="start-btn" id="startBtn" onclick="beginGame()">▶ START</button>
    </div>
    <div id="gameOver" class="card">
      <div class="title" style="font-size:clamp(16px,4.5vw,26px)">GAME OVER</div>
      <div class="score-box">
        <div class="score-row"><span>SCORE</span><span id="finalScore">0</span></div>
        <div class="score-row"><span>🟢 BEST</span><span id="bestEasyScore">0</span></div>
        <div class="score-row"><span>🔴 BEST</span><span id="bestHardScore">0</span></div>
        <div class="score-row" style="margin-top:4px"><span>MODE</span><span id="diffBadge" style="color:#a5d6a7">EASY</span></div>
      </div>
      <button class="start-btn" style="margin-top:4px" onclick="goToMenu()">☰ MAIN MENU</button>
    </div>
    <div id="highScoreScreen" class="card" style="display:none">
      <div class="title" style="font-size:clamp(13px,3.8vw,20px);color:#ffd700">NEW BEST!</div>
      <div style="font-size:clamp(48px,14vw,72px);line-height:1;margin:4px 0">🏆</div>
      <div class="score-box">
        <div class="score-row"><span>SCORE</span><span id="hsScore">0</span></div>
        <div class="score-row" style="margin-top:4px"><span>MODE</span><span id="hsDiffBadge" style="color:#a5d6a7">EASY</span></div>
      </div>
      <button class="start-btn" style="margin-top:8px" onclick="goToMenu()">☰ MAIN MENU</button>
    </div>
  </div>
</div>

<div id="installBanner">
  <div class="bird-icon">🐦</div>
  <div class="install-text">
    <span class="install-title">ADD TO HOME SCREEN</span>
    <div class="steps">
      1. Tap the <b>Share</b> button (box with arrow)<br>
      2. Scroll down &amp; tap <b>Add to Home Screen</b><br>
      3. Tap <b>Add</b> — done! 🎉
    </div>
  </div>
  <button id="closeBanner">✕</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const startScreen = document.getElementById('startScreen');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const bestEasyScoreEl = document.getElementById('bestEasyScore');
const bestHardScoreEl = document.getElementById('bestHardScore');

// ---- Sizing ----
let W, H, scale;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  // Game unit scale relative to a 375px wide phone
  scale = W / 375;
}
resize();
window.addEventListener('resize', () => { resize(); if (state !== 'play') draw(); });

// ---- State ----
let state = 'idle'; // idle | play | dead
let score = 0;
let bestEasy = parseInt(localStorage.getItem('flappy_best_easy') || '0');
let bestHard = parseInt(localStorage.getItem('flappy_best_hard') || '0');
let raf;

// ---- Bird ----
const BIRD_R = 11;
let bird = {};
function resetBird() {
  bird = {
    x: W * 0.28,
    y: H * 0.45,
    vy: 0,
    angle: 0,
    frame: 0,
    frameTimer: 0,
  };
}
resetBird();

// Physics scaled to 60fps baseline (frame-rate independent)
const TARGET_FPS = 60;
const GRAVITY = 0.0912 * (H / 667);   // per-frame at 60fps
const FLAP = -1.4625 * (H / 667);      // impulse on tap
const MAX_DOWN = 10 * (H / 667);      // terminal velocity per frame

// Hold-to-boost: track press start time
let pressStart = null;
const HOLD_MAX_MS = 500;        // full hold duration cap
const HOLD_BOOST = 2.8;         // max extra multiplier on top of baseline

function beginGame() {
  startScreen.style.display = 'none';
  scoreEl.style.display = 'block';
  state = 'play';
  pressStart = performance.now();
  bird.vy = FLAP;
  bird.angle = -0.4;
}

function goToMenu() {
  score = 0;
  scoreEl.textContent = '0';
  pipes = [];
  pipeTimer = 0;
  lastPipeTopH = null;
  resetBird();
  gameOverEl.style.display = 'none';
  document.getElementById('highScoreScreen').style.display = 'none';
  scoreEl.style.display = 'none';
  startScreen.style.display = 'flex';
  state = 'idle';
}

function startPress() {
  if (state === 'play') {
    pressStart = performance.now();
    bird.vy = FLAP;          // baseline impulse immediately
    bird.angle = -0.4;
  }
}

function endPress() {
  if (pressStart === null || state !== 'play') { pressStart = null; return; }
  const held = Math.min(performance.now() - pressStart, HOLD_MAX_MS);
  const extra = (held / HOLD_MAX_MS) * HOLD_BOOST;
  bird.vy = FLAP * (1 + extra);   // boost proportional to hold time
  bird.angle = -0.5;
  pressStart = null;
}

function flap() {
  bird.vy = FLAP;
  bird.angle = -0.4;
}

// ---- Pipes ----
const PIPE_W = 52 * scale;
let difficulty = 'hard';
const GAP_HARD = 145 * (H / 667);
const GAP_EASY = GAP_HARD * 1.20;
let GAP = GAP_HARD;

function setDiff(d) {
  difficulty = d;
  GAP = d === 'easy' ? GAP_EASY : GAP_HARD;
  document.getElementById('btnEasy').className = 'diff-btn' + (d === 'easy' ? ' selected-easy' : '');
  document.getElementById('btnHard').className = 'diff-btn' + (d === 'hard' ? ' selected-hard' : '');
}
const PIPE_SPEED = 1.6 * (W / 375);
let pipes = [];
let pipeTimer = 0;
const PIPE_INTERVAL = 90;
const MAX_PIPE_DELTA = H * 0.25; // max vertical shift between consecutive pipes
let lastPipeTopH = null;

function addPipe() {
  const minTop = H * 0.15;
  const maxTop = H * 0.65;
  let lo, hi;
  if (lastPipeTopH === null) {
    lo = minTop;
    hi = maxTop;
  } else {
    lo = Math.max(minTop, lastPipeTopH - MAX_PIPE_DELTA);
    hi = Math.min(maxTop, lastPipeTopH + MAX_PIPE_DELTA);
  }
  const topH = lo + Math.random() * (hi - lo);
  lastPipeTopH = topH;
  pipes.push({ x: W + PIPE_W, topH, passed: false });
}

// ---- Ground ----
const GROUND_H = 80 * (H / 667);
let groundX = 0;
const GROUND_SPEED = PIPE_SPEED;

// ---- Clouds ----
let clouds = [];
for (let i = 0; i < 4; i++) {
  clouds.push({ x: Math.random() * W, y: H * 0.05 + Math.random() * H * 0.25, w: 60 + Math.random() * 60, speed: 0.3 + Math.random() * 0.2 });
}

// ---- Drawing helpers ----
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, '#3ab8f0');
  grad.addColorStop(1, '#a8e4f7');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

function drawCloud(c) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  const r = c.w * 0.18;
  ctx.beginPath();
  ctx.arc(c.x, c.y, r * 1.0, 0, Math.PI * 2);
  ctx.arc(c.x + c.w * 0.25, c.y - r * 0.5, r * 1.3, 0, Math.PI * 2);
  ctx.arc(c.x + c.w * 0.55, c.y - r * 0.2, r * 1.1, 0, Math.PI * 2);
  ctx.arc(c.x + c.w * 0.8, c.y, r * 0.9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPipe(p) {
  const capH = 20 * scale;
  const capW = PIPE_W + 8 * scale;

  // bottom pipe
  const botY = p.topH + GAP;
  const botH = H - GROUND_H - botY;

  // top pipe body
  ctx.fillStyle = '#5dbd3e';
  ctx.fillRect(p.x, 0, PIPE_W, p.topH - capH);
  // top pipe shade
  ctx.fillStyle = '#4aab2d';
  ctx.fillRect(p.x + PIPE_W * 0.6, 0, PIPE_W * 0.25, p.topH - capH);
  // top pipe highlight
  ctx.fillStyle = '#7dd85a';
  ctx.fillRect(p.x, 0, PIPE_W * 0.18, p.topH - capH);
  // top cap
  ctx.fillStyle = '#5dbd3e';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2, p.topH - capH, capW, capH);
  ctx.fillStyle = '#4aab2d';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2 + capW * 0.6, p.topH - capH, capW * 0.25, capH);
  ctx.fillStyle = '#7dd85a';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2, p.topH - capH, capW * 0.18, capH);

  // bottom pipe body
  ctx.fillStyle = '#5dbd3e';
  ctx.fillRect(p.x, botY + capH, PIPE_W, botH);
  ctx.fillStyle = '#4aab2d';
  ctx.fillRect(p.x + PIPE_W * 0.6, botY + capH, PIPE_W * 0.25, botH);
  ctx.fillStyle = '#7dd85a';
  ctx.fillRect(p.x, botY + capH, PIPE_W * 0.18, botH);
  // bottom cap
  ctx.fillStyle = '#5dbd3e';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2, botY, capW, capH);
  ctx.fillStyle = '#4aab2d';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2 + capW * 0.6, botY, capW * 0.25, capH);
  ctx.fillStyle = '#7dd85a';
  ctx.fillRect(p.x - (capW - PIPE_W) / 2, botY, capW * 0.18, capH);
}

function drawGround() {
  const gY = H - GROUND_H;
  // dirt
  ctx.fillStyle = '#c8a95e';
  ctx.fillRect(0, gY, W, GROUND_H);
  // grass strip
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, gY, W, 12 * scale);
  // dark line
  ctx.fillStyle = '#5a8c30';
  ctx.fillRect(0, gY + 12 * scale, W, 3 * scale);
  // tile marks
  ctx.fillStyle = '#b8952a';
  const tileW = 36 * scale;
  for (let tx = -(groundX % tileW); tx < W; tx += tileW) {
    ctx.fillRect(tx, gY + 18 * scale, 2, GROUND_H - 18 * scale);
  }
}

function drawBird() {
  const bx = bird.x, by = bird.y;
  const r = BIRD_R * scale;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(Math.max(-0.5, Math.min(1.4, bird.angle)));

  // ── PELICAN ──────────────────────────────────────────
  const wingOff = state === 'play' ? Math.sin(bird.frameTimer * 0.28) * r * 0.55 : 0;
  const pressing = pressStart !== null;

  // tail feathers
  ctx.fillStyle = '#b0bec5';
  ctx.beginPath();
  ctx.moveTo(-r * 1.0, r * 0.1);
  ctx.lineTo(-r * 1.6, -r * 0.3);
  ctx.lineTo(-r * 1.5, r * 0.15);
  ctx.lineTo(-r * 1.7, r * 0.35);
  ctx.lineTo(-r * 1.1, r * 0.3);
  ctx.closePath();
  ctx.fill();

  // wings (flap up when pressing / holding)
  const wAngle = pressing ? -0.55 : wingOff * 0.08;
  ctx.save();
  ctx.rotate(wAngle);
  // left wing (top)
  ctx.fillStyle = '#e0e0e0';
  ctx.beginPath();
  ctx.ellipse(-r * 0.15, -r * 0.05 + wingOff, r * 1.05, r * 0.32, -0.25, 0, Math.PI * 2);
  ctx.fill();
  // left wing dark tip
  ctx.fillStyle = '#78909c';
  ctx.beginPath();
  ctx.ellipse(-r * 0.9, -r * 0.08 + wingOff, r * 0.35, r * 0.18, -0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // body — white pelican
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.15, r * 0.88, 0, 0, Math.PI * 2);
  ctx.fill();

  // belly shading
  ctx.fillStyle = '#fffde7';
  ctx.beginPath();
  ctx.ellipse(r * 0.05, r * 0.25, r * 0.65, r * 0.5, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // head
  ctx.fillStyle = '#f5f5f5';
  ctx.beginPath();
  ctx.ellipse(r * 0.75, -r * 0.55, r * 0.45, r * 0.42, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // eye ring (yellow)
  ctx.fillStyle = '#fdd835';
  ctx.beginPath();
  ctx.arc(r * 0.92, -r * 0.65, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  // eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.92, -r * 0.65, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(r * 0.95, -r * 0.65, r * 0.08, 0, Math.PI * 2);
  ctx.fill();
  // eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 0.97, -r * 0.68, r * 0.035, 0, Math.PI * 2);
  ctx.fill();

  // upper mandible (long pelican bill)
  ctx.fillStyle = '#f9a825';
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.78);
  ctx.quadraticCurveTo(r * 1.85, -r * 0.72, r * 2.1, -r * 0.55);
  ctx.quadraticCurveTo(r * 1.85, -r * 0.48, r * 0.9, -r * 0.5);
  ctx.closePath();
  ctx.fill();

  // bill ridge line
  ctx.strokeStyle = '#e65100';
  ctx.lineWidth = r * 0.06;
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.64);
  ctx.quadraticCurveTo(r * 1.6, -r * 0.6, r * 2.1, -r * 0.55);
  ctx.stroke();

  // pouch (lower mandible / throat sac)
  ctx.fillStyle = '#ff8f00';
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.5);
  ctx.quadraticCurveTo(r * 1.5, -r * 0.35, r * 2.0, -r * 0.42);
  ctx.quadraticCurveTo(r * 1.8, -r * 0.18, r * 1.1, -r * 0.05);
  ctx.quadraticCurveTo(r * 0.95, -r * 0.2, r * 0.9, -r * 0.5);
  ctx.closePath();
  ctx.fill();

  // pouch highlight
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(r * 1.35, -r * 0.32, r * 0.3, r * 0.1, -0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---- Collision ----
function checkCollision() {
  const bx = bird.x, by = bird.y;
  const r = BIRD_R * scale * 0.78; // slight forgiveness

  if (by + r >= H - GROUND_H) return true;
  if (by - r <= 0) return true;

  for (const p of pipes) {
    const capW = PIPE_W + 8 * scale;
    const px = p.x - (capW - PIPE_W) / 2;
    if (bx + r > px && bx - r < px + capW) {
      if (by - r < p.topH || by + r > p.topH + GAP) return true;
    }
  }
  return false;
}

// ---- Game Loop ----
function update(delta = 1) {
  if (state !== 'play') return;

  // bird physics
  bird.vy = Math.min(bird.vy + GRAVITY * delta, MAX_DOWN);
  bird.y += bird.vy * delta;
  bird.angle += (bird.vy * 0.045 - bird.angle) * 0.18 * delta;
  bird.frameTimer += delta;

  // ground scroll
  groundX = (groundX + GROUND_SPEED * delta) % (36 * scale);

  // clouds
  for (const c of clouds) {
    c.x -= c.speed * delta;
    if (c.x + c.w < 0) { c.x = W + c.w; c.y = H * 0.05 + Math.random() * H * 0.25; }
  }

  // pipes
  pipeTimer += delta;
  if (pipeTimer >= PIPE_INTERVAL) { addPipe(); pipeTimer = 0; }
  for (const p of pipes) {
    p.x -= PIPE_SPEED * delta;
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }
  }
  pipes = pipes.filter(p => p.x > -PIPE_W - 10 * scale);

  // collision
  if (checkCollision()) {
    state = 'dead';
    let isNewBest = false;
    if (difficulty === 'easy') {
      if (score > bestEasy) { bestEasy = score; localStorage.setItem('flappy_best_easy', bestEasy); isNewBest = true; }
    } else {
      if (score > bestHard) { bestHard = score; localStorage.setItem('flappy_best_hard', bestHard); isNewBest = true; }
    }
    scoreEl.style.display = 'none';
    if (isNewBest) {
      document.getElementById('hsScore').textContent = score;
      const hsBadge = document.getElementById('hsDiffBadge');
      hsBadge.textContent = difficulty.toUpperCase();
      hsBadge.style.color = difficulty === 'easy' ? '#a5d6a7' : '#ef9a9a';
      document.getElementById('highScoreScreen').style.display = 'flex';
    } else {
      finalScoreEl.textContent = score;
      bestEasyScoreEl.textContent = bestEasy;
      bestHardScoreEl.textContent = bestHard;
      const badge = document.getElementById('diffBadge');
      badge.textContent = difficulty.toUpperCase();
      badge.style.color = difficulty === 'easy' ? '#a5d6a7' : '#ef9a9a';
      gameOverEl.style.display = 'flex';
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  for (const c of clouds) drawCloud(c);
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();
}

let lastTime = null;
function loop(timestamp) {
  if (lastTime === null) lastTime = timestamp;
  // clamp delta so a tab-switch doesn't cause a giant jump
  const delta = Math.min((timestamp - lastTime) / (1000 / TARGET_FPS), 3);
  lastTime = timestamp;
  update(delta);
  draw();
  raf = requestAnimationFrame(loop);
}

// ---- Input ----

document.addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  e.preventDefault(); startPress();
}, { passive: false });
document.addEventListener('touchend', e => {
  if (e.target.closest('button')) return;
  e.preventDefault(); endPress();
}, { passive: false });
document.addEventListener('mousedown', e => {
  if (e.target.closest('button')) return;
  e.preventDefault(); startPress();
});
document.addEventListener('mouseup', e => {
  if (e.target.closest('button')) return;
  endPress();
});
document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) startPress();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') endPress();
});


// ---- Install Banner ----
const installBanner = document.getElementById('installBanner');
const closeBanner = document.getElementById('closeBanner');
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true;
if (isIOS && !isStandalone) {
  setTimeout(() => installBanner.classList.add('show'), 2000);
}
closeBanner.addEventListener('click', () => {
  installBanner.classList.remove('show');
});

// Generate and set apple-touch-icon from canvas
window.addEventListener('load', () => {
  const ic = document.createElement('canvas');
  ic.width = 180; ic.height = 180;
  const cx = ic.getContext('2d');
  // bg
  const g = cx.createLinearGradient(0,0,0,180);
  g.addColorStop(0,'#3ab8f0'); g.addColorStop(1,'#a8e4f7');
  cx.fillStyle = g; cx.fillRect(0,0,180,180);
  // pelican body
  cx.fillStyle='#f5f5f5';
  cx.beginPath(); cx.ellipse(82,100,48,38,0,0,Math.PI*2); cx.fill();
  // head
  cx.fillStyle='#f5f5f5';
  cx.beginPath(); cx.ellipse(118,72,22,20,0.15,0,Math.PI*2); cx.fill();
  // eye ring
  cx.fillStyle='#fdd835'; cx.beginPath(); cx.arc(124,66,10,0,Math.PI*2); cx.fill();
  cx.fillStyle='#fff';    cx.beginPath(); cx.arc(124,66,6,0,Math.PI*2); cx.fill();
  cx.fillStyle='#111';    cx.beginPath(); cx.arc(126,66,3,0,Math.PI*2); cx.fill();
  // bill
  cx.fillStyle='#f9a825';
  cx.beginPath(); cx.moveTo(118,58); cx.quadraticCurveTo(158,55,168,68);
  cx.quadraticCurveTo(158,75,118,76); cx.closePath(); cx.fill();
  // pouch
  cx.fillStyle='#ff8f00';
  cx.beginPath(); cx.moveTo(118,76); cx.quadraticCurveTo(155,80,165,70);
  cx.quadraticCurveTo(150,95,125,100); cx.quadraticCurveTo(118,88,118,76); cx.closePath(); cx.fill();
  document.getElementById('apple-touch-icon').href = ic.toDataURL('image/png');
});

// ---- Init ----
loop();
</script>
